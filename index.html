<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant — Bons Jeunes Semaine du Goût 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #faf9f7; color: #1a1a1a; line-height: 1.6; }
  .bj-header-img { width: 100%; max-height: 300px; object-fit: cover; object-position: center 40%; display: block; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }
  .bj-tagline { font-size: 15px; color: #333; margin-bottom: 1rem; font-family: Arial, sans-serif; line-height: 1.6; }
  .bj-warning { color: #C41E3A; font-weight: 700; }
  .bj-emphasis { font-weight: 700; color: #C41E3A; }

  .bj-loading { text-align: center; padding: 3rem; color: #888; font-style: italic; }
  .bj-error { background: #fff3f3; border: 1px solid #fcc; border-radius: 6px; padding: 1rem; color: #c00; margin: 1rem 0; }

  .bj-back { display: inline-block; font-size: 13px; color: #888; text-decoration: none; margin-bottom: 1.5rem; font-family: Arial, sans-serif; }
  .bj-back:hover { color: #C41E3A; }

  .bj-canton { display: inline-block; background: #FAECE7; color: #8B1428; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; font-family: Arial, sans-serif; }

  .bj-name { font-size: 30px; font-weight: 700; margin-bottom: 8px; color: #1a1a1a; }

  .bj-meta { font-size: 14px; color: #555; margin-bottom: 8px; font-family: Arial, sans-serif; }
  .bj-meta a { color: #C41E3A; text-decoration: none; }
  .bj-meta a:hover { text-decoration: underline; }

  .bj-desc { font-size: 14px; color: #555; margin-bottom: 1.5rem; font-style: italic; }

  hr { border: none; border-top: 1px solid #e8e4dc; margin: 1.5rem 0; }

  .bj-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 1.5rem; }
  @media (max-width: 600px) { .bj-two-col { grid-template-columns: 1fr; } }

  .bj-map iframe { width: 100%; height: 200px; border: none; border-radius: 6px; }

  .bj-services-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; font-family: Arial, sans-serif; }

  .bj-service-row { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0ede6; gap: 10px; font-size: 14px; font-family: Arial, sans-serif; }
  .bj-service-row:last-child { border-bottom: none; }
  .bj-svc-date { min-width: 44px; font-weight: 600; }
  .bj-svc-day { flex: 1; color: #888; font-size: 13px; }
  .bj-svc-badge { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; text-transform: uppercase; }
  .bj-midi { background: #E6F1FB; color: #0C447C; }
  .bj-soir { background: #EEEDFE; color: #3C3489; }
  .bj-svc-places { min-width: 65px; text-align: right; font-weight: 600; font-size: 13px; }
  .bj-places-low { color: #C41E3A; }

  .bj-btn { display: block; width: 100%; background: #C41E3A; color: white; text-align: center; padding: 13px; border-radius: 4px; font-size: 15px; font-weight: 700; text-decoration: none; margin-top: 14px; font-family: Arial, sans-serif; letter-spacing: 0.02em; }
  .bj-btn:hover { background: #8B1428; }

  .bj-info { background: #f5f4f0; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-size: 14px; font-family: Arial, sans-serif; }
  .bj-info h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 8px; }
  .bj-info ol { padding-left: 18px; line-height: 1.8; }
  .bj-info ol li { margin-bottom: 2px; }
  .bj-annulation { font-weight: 700; margin-top: 10px; color: #1a1a1a; }
  .bj-validity { margin-top: 8px; font-size: 13px; color: #666; }

  .bj-sponsors { border-top: 1px solid #e8e4dc; padding-top: 1rem; margin-top: 0.5rem; }
  .bj-sponsors-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; font-family: Arial, sans-serif; }
  .bj-sponsors-logos { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .bj-sponsors-logos img { height: 60px; width: auto; object-fit: contain; }
</style>
</head>
<body>
<img src="https://www.gout.ch/wp-content/uploads/2021/03/SDG_2021_BonJeunes_Bandeau_FR_1920x1050-2560x1400.jpg" alt="Gastronomie pour les jeunes - La Semaine du Goût" class="bj-header-img">
<div class="wrap">
  <a href="https://www.gout.ch/bons-jeunes/" class="bj-back">← Retour à la liste des restaurants</a>
  <div id="bj-fiche"><div class="bj-loading">Chargement du restaurant…</div></div>
</div>

<script>
(function() {
  var TOKEN = 'patFSXYxZ5KIh5wbc.211195579f2105e4d6ff1b52ac35f05a0816fb4279950fb72db12aa504ba05fc';
  var BASE = 'appspqjIM0kHmnXQr';

  var SPONSORS = {
    default: [{src:'https://www.gout.ch/wp-content/uploads/2024/11/logo-sw-150x150.webp', alt:'Swiss Wine'}],
    VD: [{src:'https://www.gout.ch/wp-content/uploads/2017/03/vins-vaudois.png',alt:'OVV'},{src:'https://www.gout.ch/wp-content/uploads/2017/06/Logo_SiL_SansBaseline-3.png',alt:'SIL'}],
    GE: [{src:'https://www.gout.ch/wp-content/uploads/2022/05/SDG_Bons-Jeunes_logo_GE.png',alt:'Swiss Wine Genève & SIG'}],
    VS: [{src:'https://www.gout.ch/wp-content/uploads/2024/06/IVV-logo.png',alt:'IVV Valais'}],
    NE: [{src:'https://www.gout.ch/wp-content/uploads/2017/03/Neuch%C3%A2tel-vins-terroir.png',alt:'Neuchâtel Vins & Terroir'}],
    FR: [{src:'https://www.gout.ch/wp-content/uploads/2017/03/logo-vignerons-vully-RVB.jpg',alt:'Vignerons du Vully'}],
    TI: [{src:'https://www.gout.ch/wp-content/uploads/2017/03/Ticinowine.png',alt:'Ticinowine'}]
  };

  var DAYS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var DAYS_DE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  var DAYS_IT = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];

  var TEXTS = {
    FR: {
      back: '← Retour à la liste des restaurants',
      back_url: 'https://www.gout.ch/bons-jeunes/',
      dispo: 'Dates & bons disponibles',
      commander: 'Commander mon bon →',
      instructions_title: 'Comment commander ?',
      instructions: [
        'Notez la date et le service souhaité ci-dessus.',
        'Cliquez sur "Commander mon bon" et remplissez le formulaire.',
        '⚠️ Dans le formulaire, tous les services s\'affichent — choisissez uniquement un service proposé par ce restaurant.',
        'Vous recevrez un e-mail de confirmation qui vaut bon. Présentez-le au restaurant.',
        'Réservez directement auprès du restaurant après réception de votre bon.',
        'Payez CHF 60.- sur place. Minérales et cafés non compris.'
      ],
      annulation: '⚠️ En cas d\'empêchement, merci de prévenir le restaurateur et de nous écrire à secretariat@gout.ch afin qu\'un·e autre jeune puisse profiter de cette offre.',
      validity: 'Les bons sont valables uniquement durant la Semaine du Goût du 17 au 27 septembre 2026.',
      sponsors: 'Avec le soutien de',
      places: function(n){return n===1?'1 bon':n+' bons';},
      days: DAYS_FR, midi: 'Midi', soir: 'Soir',
      contact_email: 'E-mail',
      contact_phone: 'Téléphone',
      contact_both: 'E-mail ou téléphone',
      reservation_contact: 'Réservation :',
      or: 'ou',
      tagline: 'Le {name} offre aux jeunes de 16-25 ans un menu gastronomique de quatre plats, accompagné {wines}, pour CHF 60.-.',
      wines_generic: 'des vins de la région',
      wines_specific: 'des vins de {desc}'
    },
    DE: {
      back: '← Zurück zur Restaurantliste',
      back_url: 'https://www.gout.ch/de/gastronomie-fuer-junge-leute/',
      dispo: 'Verfügbare Daten & Gutscheine',
      commander: 'Gutschein bestellen →',
      instructions_title: 'Wie bestellen?',
      instructions: [
        'Notieren Sie das gewünschte Datum und den Service oben.',
        'Klicken Sie auf "Gutschein bestellen" und füllen Sie das Formular aus.',
        '⚠️ Im Formular werden alle Services angezeigt — wählen Sie nur einen Service, den dieses Restaurant anbietet.',
        'Sie erhalten eine Bestätigungs-E-Mail, die als Gutschein gilt.',
        'Reservieren Sie direkt im Restaurant nach Erhalt Ihres Gutscheins.',
        'Bezahlen Sie CHF 60.- direkt im Restaurant. Mineralwasser und Kaffee nicht inbegriffen.'
      ],
      annulation: '⚠️ Bei Verhinderung bitten wir Sie, das Restaurant zu informieren und uns unter secretariat@gout.ch zu schreiben.',
      validity: 'Die Gutscheine sind nur während der Genusswoche vom 17. bis 27. September 2026 gültig.',
      sponsors: 'Mit der Unterstützung von',
      places: function(n){return n===1?'1 Gutschein':n+' Gutscheine';},
      days: DAYS_DE, midi: 'Mittag', soir: 'Abend',
      contact_email: 'E-Mail',
      contact_phone: 'Telefon',
      contact_both: 'E-Mail oder Telefon',
      reservation_contact: 'Reservation:',
      or: 'oder'
    },
    IT: {
      back: '← Torna alla lista dei ristoranti',
      back_url: 'https://www.gout.ch/it/buoni-per-i-giovani/',
      dispo: 'Date & buoni disponibili',
      commander: 'Ordinare il mio buono →',
      instructions_title: 'Come ordinare?',
      instructions: [
        'Annotate la data e il servizio desiderato qui sopra.',
        'Cliccate su "Ordinare il mio buono" e compilate il modulo.',
        '⚠️ Nel modulo vengono visualizzati tutti i servizi — scegliete solo un servizio offerto da questo ristorante.',
        'Riceverete un\'e-mail di conferma che vale come buono.',
        'Prenotate direttamente presso il ristorante dopo aver ricevuto il vostro buono.',
        'Pagate CHF 60.- direttamente al ristoratore. Acqua e caffè non compresi.'
      ],
      annulation: '⚠️ In caso di impedimento, avvisate il ristoratore e scriveteci a secretariat@gout.ch.',
      validity: 'I buoni sono validi esclusivamente durante la Settimana del Gusto dal 17 al 27 settembre 2026.',
      sponsors: 'Con il sostegno di',
      places: function(n){return n===1?'1 buono':n+' buoni';},
      days: DAYS_IT, midi: 'Pranzo', soir: 'Cena',
      contact_email: 'E-mail',
      contact_phone: 'Telefono',
      contact_both: 'E-mail o telefono',
      reservation_contact: 'Prenotazione:',
      or: 'o'
    }
  };

  function getParam(name) {
    var m = new RegExp('[?&]'+name+'=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : null;
  }

  function api(table, formula) {
    var url = '/.netlify/functions/airtable?table='+encodeURIComponent(table);
    if(formula) url += '&formula='+encodeURIComponent(formula);
    return fetch(url).then(function(r){return r.json();}).then(function(d){return d.records||[];});
  }

  function getSponsors(canton) {
    var list = (SPONSORS[canton]||[]).concat(SPONSORS.default);
    var seen={}, out=[];
    list.forEach(function(s){if(!seen[s.src]){seen[s.src]=1;out.push(s);}});
    return out;
  }

  function formatContact(f, T) {
    var pref = f['Préférence réservation'];
    var email = f['Email']||'';
    var phone = f['Téléphone']||'';
    var arr = Array.isArray(pref)?pref:(pref?[pref]:[]);
    var hasEmail = arr.some(function(p){return p.toLowerCase().indexOf('mail')>-1;});
    var hasPhone = arr.some(function(p){return p.toLowerCase().indexOf('téléphone')>-1||p.toLowerCase().indexOf('telephone')>-1||p.toLowerCase().indexOf('phone')>-1;});
    var parts = [];
    if(hasEmail && email) parts.push('<a href="mailto:'+email+'">'+email+'</a>');
    if(hasPhone && phone) parts.push(phone);
    if(parts.length === 0) return '';
    return T.reservation_contact + ' ' + parts.join(' ' + T.or + ' ');
  }

  function render(restaurant, services, lang) {
    var f = restaurant.fields;
    var T = TEXTS[lang];
    var canton = Array.isArray(f['Canton'])?f['Canton'][0]:(f['Canton']||'');
    var name = f['Nom Restaurant']||'';
    var address = (f['Adresse']||'')+(f['NPA']?' '+f['NPA']:'')+((f['Adresse']||f['NPA'])&&f['Ville']?', ':'')+( f['Ville']||'');
    var desc = f['Description']||'';
    var contact = formatContact(f, T);
    var mapSrc = 'https://maps.google.com/maps?q='+encodeURIComponent(address)+'&output=embed&z=15';

    var serviceRows = services.sort(function(a,b){return new Date(a.fields['Date'])-new Date(b.fields['Date']);}).map(function(s){
      var sf = s.fields;
      var type = sf['Service']||'';
      var places = sf['Couverts restants']||0;
      var d = new Date(sf['Date']);
      var dd = String(d.getUTCDate()).padStart(2,'0');
      var mm = String(d.getUTCMonth()+1).padStart(2,'0');
      var dayName = T.days[d.getUTCDay()];
      var badgeClass = type==='Midi'?'bj-midi':'bj-soir';
      var label = type==='Midi'?T.midi:T.soir;
      var placesClass = places<=3?'bj-places-low':'';
      return '<div class="bj-service-row">'+
        '<span class="bj-svc-date">'+dd+'.'+mm+'</span>'+
        '<span class="bj-svc-day">'+dayName+'</span>'+
        '<span class="bj-svc-badge '+badgeClass+'">'+label+'</span>'+
        '<span class="bj-svc-places '+placesClass+'">'+T.places(places)+'</span>'+
        '</div>';
    }).join('');

    var tallyUrl = 'https://tally.so/r/KYJp5X?Choisissez+votre+restaurant='+encodeURIComponent(name);
    var sponsorLogos = getSponsors(canton).map(function(s){return '<img src="'+s.src+'" alt="'+s.alt+'" onerror="this.style.display=\'none\'">';}).join('');
    var instructionItems = T.instructions.map(function(i){return '<li>'+i+'</li>';}).join('');

    document.querySelector('.bj-back').textContent = T.back;
    document.querySelector('.bj-back').href = T.back_url;
    document.title = name+' — Bons Jeunes 2026';

    var wineText = desc ? T.wines_specific.replace('{desc}', desc) : T.wines_generic;
    var tagline = T.tagline.replace('{name}', name).replace('{wines}', wineText);

    document.getElementById('bj-fiche').innerHTML =
      '<span class="bj-canton">'+canton+'</span>'+
      '<div class="bj-name">'+name+'</div>'+
      '<div class="bj-tagline">'+tagline+'</div>'+
      '<div class="bj-meta">📍 '+address+'</div>'+(contact?'<div class="bj-meta" style="margin-top:4px">'+contact+'</div>':'')+
      '<hr>'+
      '<div class="bj-two-col">'+
        '<div>'+
          '<div class="bj-services-title">'+T.dispo+'</div>'+
          (serviceRows||'<p style="font-size:13px;color:#888;font-family:Arial">—</p>')+
          '<a href="'+tallyUrl+'" class="bj-btn" target="_blank">'+T.commander+'</a>'+
        '</div>'+
        '<div class="bj-map"><iframe src="'+mapSrc+'" loading="lazy" allowfullscreen></iframe></div>'+
      '</div>'+
      '<hr>'+
      '<div class="bj-info">'+
        '<h4>'+T.instructions_title+'</h4>'+
        '<ol>'+instructionItems+'</ol>'+
        '<p class="bj-annulation">'+T.annulation+'</p>'+
        '<p class="bj-validity">'+T.validity+'</p>'+
      '</div>'+
      '<div class="bj-sponsors">'+
        '<div class="bj-sponsors-label">'+T.sponsors+'</div>'+
        '<div class="bj-sponsors-logos">'+sponsorLogos+'</div>'+
      '</div>';
  }

  function toSlug(name) {
    return name.toLowerCase()
      .replace(/[àâä]/g,'a').replace(/[æ]/g,'ae').replace(/[åã]/g,'a')
      .replace(/[éèêë]/g,'e').replace(/[îï]/g,'i')
      .replace(/[ôöø]/g,'o').replace(/[œ]/g,'oe')
      .replace(/[ùûü]/g,'u').replace(/[ç]/g,'c').replace(/[ñ]/g,'n')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }

  function init() {
    var slug = getParam('r');
    if(!slug){
      document.getElementById('bj-fiche').innerHTML='<div class="bj-error">Aucun restaurant spécifié.</div>';
      return;
    }
    Promise.all([
      api('Restaurants', "{Statut}='Confirmé'"),
      api('Services',"{Couverts restants} > 0")
    ]).then(function(results){
      var restaurants=results[0], services=results[1];
      var matched=restaurants.filter(function(r){
        return toSlug(r.fields['Nom Restaurant']||'')===slug.toLowerCase();
      });
      if(!matched.length){
        document.getElementById('bj-fiche').innerHTML='<div class="bj-error">Restaurant introuvable.</div>';
        return;
      }
      var r=matched[0];
      var langField=r.fields['Langue'];
      var lang=Array.isArray(langField)?langField[0]:(langField||'FR');
      if(lang==='Français')lang='FR';
      if(lang==='Deutsch')lang='DE';
      if(lang==='Italiano')lang='IT';
      if(!TEXTS[lang])lang='FR';
      var rServices=services.filter(function(s){return Array.isArray(s.fields['Restaurant'])&&s.fields['Restaurant'].indexOf(r.id)>-1;});
      render(r,rServices,lang);
    }).catch(function(){
      document.getElementById('bj-fiche').innerHTML='<div class="bj-error">Erreur de chargement.</div>';
    });
  }

  init();
})();
</script>
</body>
</html>
